# Serves the built SPA. The gateway terminates TLS and routes to us; we only
# serve static files and fall back to index.html so client-side routes resolve.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted build assets are content-hashed, so a changed file is a changed
    # name. They can be cached forever, letting repeat loads skip revalidation.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry documents keep stable names across deploys, so without this the
    # browser's heuristic caching (no Cache-Control + a Last-Modified) serves a
    # stale index.html/worker on launch and the app cold-starts the old build until
    # a manual refresh. "no-cache" means "always revalidate", not "never store": a
    # conditional request still gets a 304 when nothing changed, but picks up a new
    # build immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
